# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A beeping busy beaver machine for the Σ₂ form of P vs NP"
  description: >-
    Explicit one-tape, two-symbol Turing machines with a designated beep state
    (Aaronson's beeping busy beaver convention), given as literal transition tables,
    together with core-Lean proofs (no Mathlib) that each machine, run from the blank
    tape, beeps only finitely often exactly when a stated Sigma_2 sentence holds.
    The flagship machine (278 states) is equivalent to the Sigma_2 form of P = NP:
    some candidate program decides a fixed self-padded NP-complete language within a
    polynomial clock on every instance. The equivalence of that sentence with P = NP
    is also proved in Lean (ZP.Cx.sentence_iff_PeqNP) for the Turing-machine models
    defined in the development. The same guest interpreter yields machines for further
    Sigma_2 statements (P = PP and P = PSPACE, factoring, discrete
    logarithm, graph isomorphism, an NTT-based variant over least primes 1 + n i,
    multiplication, and a co-NP verifier variant), and a 19-state machine that
    quasihalts iff there are finitely many twin primes.
  authors:
    - "Gregory Morse"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gregory Morse"

classification:
  arxiv: ["cs.CC", "math.LO"]
  msc2020: ["68Q15", "03D10", "68V15"]

sources:
  - title: "Explicit beeping busy beaver machine whose quasihalting is equivalent to the Σ₂ form of P = NP"
    type: original-proof
    relationship: other
    note: "Construction, compiler and paper proof in docs/spec.md of this repository."
  - title: "The Busy Beaver Frontier"
    authors:
      - "Scott Aaronson"
    type: paper
    location: "SIGACT News 51(3), 2020"
    relationship: background
    note: "Defines beeping busy beavers and quasihalting, and observes that Σ₂ statements reduce to quasihalting."

related_formalizations:
  - id: "https://github.com/calr3/tinycryptids/tree/main/twinprimes"
    relationship: "independent"
    note: "C. Reams' earlier 18-state twin-prime beeper, proved in Lean (Oct 2026). It marks a beep transition rather than a beep state; under this repository's beeping-busy-beaver convention (a state entered only at beeps) the same-family design here has 19 states, and 18 when counted Reams' way. The selected twin-prime machine and its Lean proof are independent work; see twin/README.md for the comparison."

status:
  scope: >-
    Formalized and proved, with no remaining sorry outside the deliberate Challenge
    placeholders: the definitions of the machines, quasihalting, the guest semantics
    and the sentences (ZP/Defs*.lean, tables in ZP/Table*.lean); for each of the ten
    advertised machines, quasihalting of the literal table is equivalent to its
    sentence (abstract program, logical-machine macro simulation, compilation to the
    table); and Sentence iff P = NP for the flagship machine (ZP/Hard.lean). The
    equivalence of the other sentences with natural complexity-theoretic statements
    is stated informally in the docs and is not formalized. The existence of primes
    1 + n i used by the NTT machine is proved in core Lean (ZP/Cyclo.lean).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: "AI agent wrote the compiler, tests and Lean files; Lean was checked in GitHub Actions CI"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "API-only"
      prompting_notes: "Project brief by the author; the agent worked from it"
  spend_usd: "subscription-based"
  notes: "Human-directed design; AI-assisted implementation and proofs; review status below."

fidelity:
  divergences: "The Challenge statements stop at the Sigma_2 sentences. The equivalence Sentence iff P = NP for the flagship machine is proved in the development but is not itself a Challenge statement; for the other machines the relation of the sentence to its informal reading is documented in docs/native.md only. None known after comparing definitions against the Python reference implementations by kernel-evaluated examples."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "Definitions cross-checked against the Python reference by kernel-evaluated examples (ZP/Checks.lean). The Lean proofs are checked in GitHub Actions CI, including the Palomar Comparator."

