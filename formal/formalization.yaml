# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A beeping busy beaver machine for the Σ₂ form of P vs NP"
  description: >-
    An explicit one-tape, two-symbol Turing machine with a designated beep state
    (Aaronson's beeping busy beaver convention), given as a literal transition
    table. The advertised theorem says the machine, run from the blank tape, is in
    its beep state only finitely often iff an explicit Σ₂ sentence holds: some
    candidate program decides a fixed self-padded NP-complete language within a
    polynomial clock on every instance. The equivalence of that sentence with
    P = NP is proved on paper in the accompanying repository and is not part of the
    formal statement.
  authors:
    - "Gregory Morse"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gregory Morse"

classification:
  arxiv: ["cs.CC", "math.LO"]
  msc2020: ["68Q15", "03D10", "68V15"]

sources:
  - title: "Explicit beeping busy beaver machine whose quasihalting is equivalent to the Σ₂ form of P = NP"
    type: original-proof
    relationship: other
    note: "Construction, compiler and paper proof in docs/spec.md of this repository."
  - title: "The Busy Beaver Frontier"
    authors:
      - "Scott Aaronson"
    type: article
    location: "SIGACT News 51(3), 2020"
    relationship: background
    note: "Defines beeping busy beavers and quasihalting, and observes that Σ₂ statements reduce to quasihalting."

status:
  scope: >-
    Formalized and proved: the definitions of the machine, quasihalting, the guest
    semantics and the sentence (ZP/Defs.lean); the abstract program quasihalts iff
    the sentence holds (ZP/Abstract.lean). Not yet proved: that the literal table
    simulates the abstract program beep for beep (ZP/Bridge.lean, one sorry). Not
    formalized at all: the sentence is equivalent to P = NP.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: "AI agent wrote the compiler, tests and Lean files; Lean was checked in GitHub Actions CI"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "API-only"
      prompting_notes: "Project brief by the author; the agent worked from it"
  spend_usd: "subscription-based"
  notes: "Human-directed design; AI-assisted implementation and proofs; review status below."

fidelity:
  divergences: "The formal statement stops at the Σ₂ sentence; its equivalence with P = NP is paper-only."

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "Definitions cross-checked against the Python reference by kernel-evaluated examples (ZP/Checks.lean)."

alignment:
  namespace: "ZP"
  statements:
    - source: "docs/spec.md, Theorem (Tier 1 part)"
      lean: "ZP.zp_quasihalts_iff_sentence"
      module: "Challenge"
      status: "partial"
      note: "Proved from ZP.abstractQuasihalts_iff_sentence and the open bridge ZP.zp_quasihalts_iff_abstract."

acknowledgements: "Lean 4 core; the Palomar template's layout and Comparator setup."
