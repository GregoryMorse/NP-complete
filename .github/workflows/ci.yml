name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  machines:
    name: Build machines and run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rebuild machines and require them to match the commit
        run: |
          python3 build.py
          git diff --stat --exit-code machines/
      - name: Reproducibility (two hash seeds)
        run: bash tests/check_reproducible.sh
      - name: Counter machine vs reference
        run: python3 tests/test_cm.py
      - name: Register coalescing soundness
        run: python3 tests/test_regalloc.py
      - name: FACTOR / DIGRAPH-ISO brute force vs reference
        run: python3 tests/test_truth.py
      - name: Multitape interpreter (MUL-LIN) vs reference
        run: python3 tests/test_mult.py
      - name: NTT circuit search vs reference
        run: python3 tests/test_ntt.py
      - name: Native Z_P v2 vs reference
        run: python3 tests/test_native.py
      - name: TM vs counter machine (lockstep)
        run: python3 tests/test_tm.py
      - name: Compiled TMs vs reference (C simulators)
        run: python3 tests/diff_tm_ref.py

  lean:
    name: Lean (core only, no Mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source rules and sorry census
        run: python3 formal/scripts/check_sources.py
      - name: Generated tables match machines/*.tbl
        run: |
          for m in zp_native zpp_native zps_native zfactor_native zdlog_native zgi_native; do
            python3 formal/gen_table.py $m
          done
          git diff --exit-code formal/ZP/Table*.lean
      - name: Generated logical machines and certificates match native/*.py
        run: |
          for m in zp base zpp zps zfac zdl zgi; do
            python3 formal/gen_logic.py $m
          done
          git diff --exit-code formal/ZP/Logic*.lean
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal
          build: false
          use-mathlib-cache: false
      - name: lake build (errors become annotations)
        working-directory: formal
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log || {
            python3 scripts/annotate.py build.log
            exit 1
          }

  comparator:
    name: Palomar Comparator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal
          build: false
          use-mathlib-cache: false
      - name: Install bubblewrap for the Comparator sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: lake comparator
        run: |
          set -o pipefail
          ./formal/scripts/verify-comparator.sh 2>&1 | tee comparator.log || {
            tail -c 2500 comparator.log | python3 -c 'import sys; print("::error::" + sys.stdin.read().replace("%", "%25").replace("\n", "%0A"))'
            exit 1
          }
